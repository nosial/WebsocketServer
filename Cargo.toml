[package]
name = "websocket-server"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "WebSocket to TCP bridge server for PHP applications"
authors = ["Nosial"]
license = "MIT"
homepage = "https://github.com/nosial/WebsocketServer"
repository = "https://github.com/nosial/WebsocketServer"
readme = "README.md"
keywords = ["websocket", "tcp", "bridge", "php", "tls"]
categories = ["network-programming", "web-programming"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["handshake", "connect", "rustls-tls-native-roots"] }
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2"
rcgen = "0.14"
acme-lib = "0.9"
openssl = { version = "0.10", features = ["vendored"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.10"
serde_json = "1"

[profile.dev]
opt-level = 0
debug = 1
strip = "none"
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false

[profile.test]
opt-level = 0
debug = 2
strip = "none"

[profile.bench]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[dev-dependencies]
rustls-pki-types = "1"
futures-util = "0.3"
